name: Options Inspector
on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months to test"
        default: "12"
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Test the strategies
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_ENV: ${{ vars.ALPACA_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python premium_lab.py
      - name: Save the report
        run: |
          mkdir -p /tmp/report && cp premium_lab.html premium_lab.json /tmp/report/
          git config user.name "strategy-lab"
          git config user.email "strategy-lab@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin inspector-lab && git reset -q --hard origin/inspector-lab
            cp /tmp/report/* .
            git add premium_lab.html premium_lab.json
            git diff --cached --quiet && exit 0
            git commit -qm "Premium Lab report" && git push -q origin HEAD:inspector-lab && exit 0
            sleep 5
          done
          exit 1

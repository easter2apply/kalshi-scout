name: Vault Options
on:
  schedule:
    - cron: "37 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scan now · auto = what the timer uses"
        default: "full"
        type: choice
        options: [full, auto]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Vault Options
        id: bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY

name: Vault Options
on:
  schedule:
    - cron: "37 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scan now · auto = what the timer uses"
        default: "full"
        type: choice
        options: [full, auto]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: options-scan
      cancel-in-progress: false
    outputs:
      deploy: ${{ steps.bot.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Vault Options
        id: bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_ENV: ${{ vars.ALPACA_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python vault_options.py --out site/index.html --mode "${{ inputs.mode || 'auto' }}"
      - name: Vault HQ + morning brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python hq.py --out site/hq.html || echo "HQ failed (the bot itself is fine)"
          cp options_inspector.html site/inspector.html 2>/dev/null || true
      - name: Save bot memory
        run: |
          git config user.name "vault-options"
          git config user.email "vault-options@users.noreply.github.com"
          git add options_state.json 2>/dev/null || true
          git add hq_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update state" && git pull --rebase && git push)
      - if: steps.bot.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is its own job: if GitHub Pages ever hangs, the next run cancels it
  # instead of the whole bot freezing behind it.
  publish:
    needs: scan
    if: needs.scan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: options-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
